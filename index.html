<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prakash Electronics</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #myVideo {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -1;
            opacity: 0.8;
        }

        body {
            color: white;
            font-family: "Poppins", sans-serif;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 80px;
            background-color: rgb(18, 18, 62);
            padding: 1rem 5%;
            position: relative;
        }

        /* NAVBAR BRANDING */
        nav .left {
            font-family: "Montserrat", sans-serif;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            color: white;
        }

        nav .right ul {
            display: flex;
            list-style: none;
        }

        nav .right ul li {
            margin: 0 1rem;
        }

        nav .right ul li a {
            text-decoration: none;
            color: white;
            font-size: 1rem;
            transition: color 0.3s ease;
        }

        nav .right ul li a:hover {
            color: rgb(155, 155, 250);
        }

        .hamburger {
            display: none;
            cursor: pointer;
            flex-direction: column;
            gap: 4px;
        }

        .hamburger .line {
            width: 25px;
            height: 3px;
            background-color: white;
            border-radius: 5px;
            transition: all 0.3s ease-in-out;
        }

        .firstSection {
            display: flex;
            justify-content: space-around;
            margin: 80px 0;
            align-items: center;
            padding: 0 5%;
        }

        .firstSection > div {
            width: 45%;
        }

        .leftSection {
            font-size: 2.5rem;
        }

        .rightSection {
            text-align: center;
        }

        .rightSection img {
            width: 80%;
            max-width: 200px;
            margin: 50px 0;
            border-radius: 1rem;
            cursor: pointer;
        }

        .rightSection img:hover {
            transform: scale(1.03);
            transition: transform 0.3s ease-in-out;
        }

        .purple {
            color: white;
        }

        #element {
            text-transform: capitalize;
            color: white;
            font-weight: bold;
        }

        .import {
            color: black;
        }

        main hr {
            border: 0;
            background: rgb(121, 12, 223);
            height: 1.2px;
            margin: 40px 84px;
        }

        .secondSection {
            max-width: 1500px;
            margin: 40px auto;
            height: auto;
            padding: 0 30px;
        }

        .products {
            color: black;
            text-align: center;
            width: 100%;
            font-weight: bold;
            font-size: 1.5rem;
            padding: 20px 5px;
        }

        /* 4 PRODUCTS IN ONE ROW */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            width: 100%;
            align-items: stretch;
        }

        .product-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 12px;
            overflow: hidden;
            padding: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            min-width: 0;
        }

        .product-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* SAME IMAGE AREA FOR ALL PRODUCTS */
        .product-image {
            width: 100%;
            height: 390px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white;
            overflow: hidden;
            border-radius: 8px;
        }

        .product-image img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            cursor: pointer;
            transition: transform 0.3s ease-in-out;
        }

        .product-item:hover .product-image img {
            transform: scale(1.02);
        }

        /* PRODUCT DESCRIPTION - SAME LEVEL */
        .product-item p {
            width: 100%;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0 5px;
            color: black;
            font-weight: 600;
            font-size: 0.95rem;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* TABLET */
        @media (max-width: 1100px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 25px;
            }

            .product-image {
                height: 400px;
            }
        }

        /* MOBILE */
        @media (max-width: 768px) {
            nav {
                height: 70px;
            }

            nav .left {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .hamburger {
                display: flex;
            }

            nav .right ul {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background-color: rgb(18, 18, 62);
                z-index: 100;
            }

            nav .right ul.active {
                display: flex;
            }

            nav .right ul li {
                margin: 0;
                width: 100%;
                text-align: center;
            }

            nav .right ul li a {
                display: block;
                padding: 1rem;
            }

            nav .right ul li a:hover {
                background-color: rgb(28, 28, 82);
            }

            .firstSection {
                flex-direction: column;
                text-align: center;
                margin: 40px 0;
            }

            .firstSection > div {
                width: 90%;
            }

            .leftSection {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }

            .rightSection img {
                width: 50%;
                margin: 20px 0;
            }

            .secondSection {
                padding: 0 20px;
            }

            .product-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            .product-image {
                height: 350px;
            }

            .product-item p {
                font-size: 0.85rem;
            }
        }

        /* SMALL PHONES */
        @media (max-width: 480px) {
            nav .left {
                font-size: 1.25rem;
            }

            .leftSection {
                font-size: 1.5rem;
            }

            .rightSection img {
                width: 60%;
            }

            .products {
                font-size: 1.2rem;
            }

            .product-grid {
                grid-template-columns: 1fr;
            }

            .product-image {
                height: 400px;
            }

            .product-item p {
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <video autoplay loop muted playsinline id="myVideo">
        <source src="5846591-hd_1920_1080_25fps.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <header>
        <nav>
            <div class="left">
                Prakash Electronics

                <div class="hamburger">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>
            </div>

            <div class="right">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>

        <section class="firstSection">
            <div class="leftSection">
                <span class="purple"><b>Prakash Electronics</b></span>
                <div class="import"><b>Importer, Stockists & Pioneers of</b></div>
                <span id="element"></span>
            </div>

            <div class="rightSection">
                <img
                    src="https://3.imimg.com/data3/HP/CR/MY-3059290/prakash-electronics-logo-120x120.png"
                    alt="Prakash Electronics Logo"
                >
            </div>
        </section>

        <hr>

        <section class="secondSection">

            <h3 class="products">Main Products</h3>

            <div class="product-grid">

                <div class="product-item">
                    <div class="product-image">
                        <img
                            src="images/heating elements for high temp appl.png"
                            alt="Heating Elements for High Temperature Applications"
                        >
                    </div>
                    <p>Heating Elements for High Temperature Applications</p>
                </div>

                <div class="product-item">
                    <div class="product-image">
                        <img
                            src="images/hre.png"
                            alt="HRE"
                        >
                    </div>
                    <p>HRE</p>
                </div>

                <div class="product-item">
                    <div class="product-image">
                        <img
                            src="images/Nichrome80-20.png"
                            alt="Nichrome 80-20"
                        >
                    </div>
                    <p>Nichrome 80-20</p>
                </div>

                <div class="product-item">
                    <div class="product-image">
                        <img
                            src="images/ocr21al6nb.png"
                            alt="OCr21Al6Nb"
                        >
                    </div>
                    <p>OCr21Al6Nb</p>
                </div>

            </div>
        </section>

    </main>

    <script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script>

    <script>
        var typed = new Typed('#element', {
            strings: [
    'Spark Brand Heating Wires',
    'Furnace Manufacturing',
    'Industrial Furnaces',
    'Heat Treatment',
    'Heating Elements',
    'Heating Wires',
    'Resistance Heating',
    'Resistance Wire',
    'Heating Alloys',
    'High Temperature Alloys',
    'Industrial Heating',
    'Electric Furnaces',
    'Heat Treatment Furnaces',
    'Furnace Components',
    'NiCr Wire',
    'FeCrAl Wire',
    'Furnace OEM',
    'Heat Treatment Equipment',
    'Industrial Heating Solutions',
    'Heating Products',
    'Furnace Manufacturers'
],
            typeSpeed: 50,
            loop: true,
            backSpeed: 25
        });

        const hamburger = document.querySelector(".hamburger");
        const navMenu = document.querySelector(".right ul");

        hamburger.addEventListener("click", () => {
            hamburger.classList.toggle("active");
            navMenu.classList.toggle("active");
        });
    </script>

</body>

</html>
